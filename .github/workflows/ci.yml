name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          find scripts tools -name '*.sh' -print0 | xargs -0 -r shellcheck

      # CI has no preinstalled Chromium, so fetch Playwright's and point
      # check-all at it. Locally the environment's browser is used instead.
      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          echo "PW_CHROMIUM=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: check-all
        run: ./scripts/check-all.sh
